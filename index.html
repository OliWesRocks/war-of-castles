<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>War of Castles</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #16110a; font-family: Georgia, 'Times New Roman', serif; }

    #app { display: flex; width: 100%; height: 100%; }

    /* ── Sidebar ── */
    #sidebar {
      width: 210px;
      flex-shrink: 0;
      height: 100%;
      background: #16110a;
      border-right: 2px solid #3a2810;
      display: flex;
      flex-direction: column;
      padding: 18px 14px;
    }
    .game-title {
      color: #c9a84c;
      font-size: 16px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-align: center;
      padding-bottom: 14px;
      border-bottom: 1px solid #3a2810;
      margin-bottom: 16px;
    }
    .s-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #6a5030;
      margin-bottom: 6px;
    }
    .s-section { margin-bottom: 16px; }
    .sep { border: none; border-top: 1px solid #261a08; margin: 0 0 16px; }

    .turn-row { display: flex; align-items: baseline; gap: 6px; }
    .turn-num { color: #e8d090; font-size: 35px; line-height: 1; }
    .turn-of  { color: #6a5030; font-size: 15px; }

    .pips { display: flex; gap: 7px; margin-top: 8px; }
    .pip {
      width: 16px; height: 16px; border-radius: 50%;
      background: #c9a84c; border: 1px solid #8a6820;
    }
    .pip.used { background: #261a08; border-color: #3a2810; }

    .faction-list { display: flex; flex-direction: column; gap: 10px; }
    .faction-row  { display: flex; align-items: center; gap: 8px; }
    .f-dot {
      width: 11px; height: 11px; border-radius: 2px; flex-shrink: 0;
    }
    .f-name { color: #c0a870; font-size: 14px; flex: 1; }
    .f-meta { color: #6a5030; font-size: 12px; }

    .event-box {
      border: 1px dashed #2a1e0a; border-radius: 3px;
      padding: 10px; min-height: 52px;
      display: flex; flex-direction: column; gap: 6px;
      align-items: flex-start; justify-content: center;
    }
    .event-empty { color: #3a2810; font-size: 12px; font-style: italic; align-self: center; }
    .event-box-header { display: flex; align-items: center; gap: 7px; }
    .event-box-desc { color: #6a5030; font-size: 11px; font-style: italic; line-height: 1.5; }

    /* ── Event card overlay ── */
    #event-card {
      display: none;
      position: fixed; inset: 0; z-index: 80;
      pointer-events: none;
      align-items: center; justify-content: center;
      background: rgba(22, 17, 10, 0.55);
    }
    .event-card-inner {
      background: #1a1206;
      border: 2px solid #7a5a1a;
      border-radius: 8px;
      padding: 32px 56px;
      text-align: center;
      display: flex; flex-direction: column; align-items: center; gap: 12px;
      box-shadow: 0 0 80px rgba(0, 0, 0, 0.8);
      animation: eventCardIn 0.35s ease-out;
    }
    .event-card-emoji { font-size: 56px; line-height: 1; }
    .event-card-label { color: #6a5030; font-size: 9px; letter-spacing: 3px; text-transform: uppercase; }
    .event-card-name  { color: #e8d090; font-size: 26px; letter-spacing: 1px; }
    @keyframes eventCardIn {
      from { opacity: 0; transform: scale(0.85); }
      to   { opacity: 1; transform: scale(1); }
    }

    /* ── Income flash ── */
    #income-flash {
      color: #8fbe70;
      font-size: 12px;
      text-align: center;
      padding: 4px 0 8px;
      letter-spacing: 0.5px;
    }

    /* ── Recruitment panel ── */
    #recruit-panel { margin-bottom: 0; }
    #recruit-btn {
      width: 100%;
      padding: 9px;
      background: #1e3a18;
      color: #8fbe70;
      border: 1px solid #3a6828;
      border-radius: 3px;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 13px;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
    }
    #recruit-btn:hover:not(:disabled) { background: #2a5020; }
    #recruit-btn:disabled { opacity: 0.35; cursor: default; }

    /* ── Canvas wrap ── */
    #map-wrap { flex: 1; position: relative; overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; }

    /* ── Army split stepper ── */
    #split-stepper {
      display: none;
      position: absolute;
      background: #1a1206;
      border: 1px solid #6a4820;
      border-radius: 4px;
      padding: 5px 8px;
      gap: 8px;
      align-items: center;
      z-index: 50;
      transform: translate(-50%, -100%);
      box-shadow: 0 2px 12px rgba(0,0,0,0.7);
      user-select: none;
      pointer-events: all;
    }
    .split-btn {
      width: 22px; height: 22px;
      background: #3a2810; color: #c9a84c;
      border: 1px solid #6a4820; border-radius: 2px;
      cursor: pointer; font-size: 17px;
      font-family: Georgia, 'Times New Roman', serif;
      display: flex; align-items: center; justify-content: center;
      line-height: 1;
    }
    .split-btn:hover { background: #4a3418; }
    #split-count { color: #e8d090; font-size: 14px; min-width: 18px; text-align: center; font-family: Georgia, 'Times New Roman', serif; }

    /* ── Portrait guard ── */
    #rotate-prompt {
      display: none;
      position: fixed; inset: 0; z-index: 100;
      background: #16110a; color: #c9a84c;
      font-family: Georgia, serif;
      flex-direction: column; align-items: center; justify-content: center;
      gap: 16px; font-size: 18px; text-align: center; padding: 40px;
    }
    .rot-icon { font-size: 56px; }

    @media (orientation: portrait) {
      #app { display: none; }
      #rotate-prompt { display: flex; }
    }

    /* ── End Turn button ── */
    #end-turn-btn {
      margin-top: auto;
      width: 100%;
      padding: 10px;
      background: #3a2810;
      color: #c9a84c;
      border: 1px solid #6a4820;
      border-radius: 3px;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 13px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
    }
    #end-turn-btn:hover { background: #4a3418; }
    #end-turn-btn:disabled { opacity: 0.5; cursor: default; }

    /* ── Game Over screen ── */
    #gameover-screen {
      display: none;
      position: fixed; inset: 0; z-index: 90;
      background: rgba(22, 17, 10, 0.92);
      align-items: center; justify-content: center;
    }
    .gameover-box {
      background: #1a1206;
      border: 2px solid #7a5a1a;
      border-radius: 8px;
      padding: 40px 56px;
      text-align: center;
      display: flex; flex-direction: column; align-items: center; gap: 20px;
      min-width: 360px; max-width: 520px;
      box-shadow: 0 0 100px rgba(0,0,0,0.9);
    }
    .gameover-title  { font-size: 32px; font-weight: bold; letter-spacing: 3px; text-transform: uppercase; }
    .gameover-winner { color: #c0a870; font-size: 15px; letter-spacing: 0.5px; }
    .gameover-scores {
      display: flex; flex-direction: column; gap: 10px; width: 100%;
      border-top: 1px solid #2a1e0a; padding-top: 18px;
    }
    .score-row { display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-radius: 3px; }
    .score-row.winner { background: rgba(201,168,76,0.12); border: 1px solid rgba(201,168,76,0.25); }
    .score-dot  { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }
    .score-name { color: #c0a870; font-size: 13px; flex: 1; text-align: left; }
    .score-stats { color: #6a5030; font-size: 12px; }
    .score-row.winner .score-name  { color: #e8d090; }
    .score-row.winner .score-stats { color: #a88840; }
    .gameover-btns { display: flex; gap: 16px; margin-top: 8px; }
    .gameover-btn {
      padding: 11px 28px; background: #3a2810; color: #c9a84c;
      border: 1px solid #6a4820; border-radius: 3px;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; cursor: pointer;
    }
    .gameover-btn:hover { background: #4a3418; }

    /* ── Resume prompt ── */
    #resume-prompt {
      display: none;
      position: fixed; inset: 0; z-index: 60;
      background: rgba(22, 17, 10, 0.88);
      align-items: center; justify-content: center;
    }
    .resume-box {
      background: #1e1608; border: 1px solid #3a2810; border-radius: 4px;
      padding: 30px 36px; text-align: center;
      display: flex; flex-direction: column; gap: 14px;
    }
    .resume-title { color: #c9a84c; font-size: 15px; text-transform: uppercase; letter-spacing: 2px; }
    .resume-sub   { color: #7a6040; font-size: 11px; }
    .resume-btns  { display: flex; gap: 12px; justify-content: center; margin-top: 6px; }
    .resume-btn {
      padding: 9px 22px; background: #3a2810; color: #c9a84c;
      border: 1px solid #6a4820; border-radius: 3px;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; cursor: pointer;
    }
    .resume-btn:hover { background: #4a3418; }
  </style>
</head>
<body>

<div id="rotate-prompt">
  <div class="rot-icon">&#8635;</div>
  <div>Rotate your device to landscape to play</div>
</div>

<div id="gameover-screen">
  <div class="gameover-box">
    <div id="gameover-title" class="gameover-title"></div>
    <div id="gameover-winner" class="gameover-winner"></div>
    <div id="gameover-scores" class="gameover-scores"></div>
    <div class="gameover-btns">
      <button class="gameover-btn" id="gameover-play-again">Play Again</button>
      <button class="gameover-btn" id="gameover-new-game">New Game</button>
    </div>

</div>

<div id="resume-prompt">

    <div class="resume-btns">

<div id="event-card">
  <div class="event-card-inner">
    <div class="event-card-emoji"></div>
    <div class="event-card-label">World Event</div>
    <div class="event-card-name"></div>
  </div>
</div>

<div id="app">
  <aside id="sidebar">
    <div class="game-title">War of Castles</div>

    <div class="s-section">
      <div class="s-label">Turn</div>
      <div class="turn-row">
        <span class="turn-num" id="turn-num">1</span>
        <span class="turn-of">/ 12</span>
      </div>
      <div id="active-turn-label" style="color:#c9a84c;font-size:13px;margin-top:8px;letter-spacing:0.5px">Your Turn</div>
    </div>

    <div class="s-section">
      <div class="s-label">Moves Remaining</div>
      <div class="pips">
        <div class="pip"></div>
        <div class="pip"></div>
        <div class="pip"></div>
      </div>
    </div>

    <div id="income-flash" style="display:none"></div>

    <hr class="sep">

    <div class="s-section">
      <div class="s-label">Factions</div>
      <div class="faction-list">
        <div class="faction-row" data-faction="0">
          <div class="f-dot" style="background:#c97b84"></div>
          <div class="f-name">Merchants</div>
          <div class="f-meta">— rgn · 0c</div>
        </div>
        <div class="faction-row" data-faction="1">
          <div class="f-dot" style="background:#4a7fa5"></div>
          <div class="f-name">Warriors</div>
          <div class="f-meta">— rgn · 0c</div>
        </div>
        <div class="faction-row" data-faction="2">
          <div class="f-dot" style="background:#8a9a5b"></div>
          <div class="f-name">Stoics</div>
          <div class="f-meta">— rgn · 0c</div>
        </div>
        <div class="faction-row" data-faction="3">
          <div class="f-dot" style="background:#5fb3a1"></div>
          <div class="f-name">Ninjas</div>
          <div class="f-meta">— rgn · 0c</div>

    </div>

    <div id="recruit-panel" style="display:none">
      <hr class="sep">
      <div class="s-section">
        <div class="s-label">Recruit</div>
        <div id="recruit-info" style="color:#c0a870;font-size:13px;line-height:1.8;margin-bottom:10px"></div>
        <button id="recruit-btn">Recruit</button>
      </div>
    </div>

    <button id="end-turn-btn">End Turn</button>

  <div id="map-wrap">
    <canvas id="canvas"></canvas>
    <div id="split-stepper">
      <button class="split-btn" id="split-minus">−</button>
      <span id="split-count">1</span>
      <button class="split-btn" id="split-plus">+</button>
    </div>
  </div>
</div>

<script>
'use strict';

const canvas = document.getElementById('canvas');
const ctx    = canvas.getContext('2d');

// ─── Water texture ────────────────────────────────────────────────────────────
let waterPattern = false;
const _waterImg  = new Image();
_waterImg.onload = () => { waterPattern = true; render(); };
_waterImg.src = 'water3.jpg';

// ─── Land texture ─────────────────────────────────────────────────────────────
let regionsReady = false;
const _regionsImg = new Image();
_regionsImg.onload  = () => { regionsReady = true; render(); };
_regionsImg.onerror = () => console.error('Failed to load Regions.jpg');
_regionsImg.src = 'Regions.jpg';

// ─── Castle image ─────────────────────────────────────────────────────────────
let castleImgReady = false;
const _castleImg = new Image();
_castleImg.onload  = () => { castleImgReady = true; render(); };
_castleImg.onerror = () => console.error('Failed to load Castle2.jpg');
_castleImg.src = 'Castle2.jpg';

function hexToRgba(hex, alpha) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return `rgba(${r},${g},${b},${alpha})`;
}

// ─── Logical coordinate space ─────────────────────────────────────────────────
const LW = 1000, LH = 640;

// ─── Color constants (used by rendering) ─────────────────────────────────────
const NEUTRAL_COLOR  = '#d4c9a8';
const FACTION_COLORS = ['#c97b84','#4a7fa5','#8a9a5b','#5fb3a1'];

// ─── Procedural map generator (jittered Voronoi) ──────────────────────────────
// Sea regions are ordinary Voronoi cells whose seeds happen to be designated
// sea before generation runs.  They shape the land exactly like any other cell
// and act as impassable interior barriers / chokepoints.

const MAP_PAD = 45;
const LX0 = MAP_PAD,      LY0 = MAP_PAD;
const LX1 = LW - MAP_PAD, LY1 = LH - MAP_PAD;

// Clip convex polygon to the half-plane "closer to a than b".
function clipCell(poly, a, b) {
  const mx = (a[0]+b[0])*0.5, my = (a[1]+b[1])*0.5;
  const nx = b[0]-a[0],       ny = b[1]-a[1];
  const d  = mx*nx + my*ny;
  const inside = v => v[0]*nx + v[1]*ny <= d + 1e-9;
  const out = [];
  for (let i = 0; i < poly.length; i++) {
    const c = poly[i], n = poly[(i+1) % poly.length];
    const ci = inside(c), ni = inside(n);
    if (ci) out.push(c);
    if (ci !== ni) {
      const dx=n[0]-c[0], dy=n[1]-c[1], denom=dx*nx+dy*ny;
      if (Math.abs(denom) > 1e-10) {
        const t = (d - c[0]*nx - c[1]*ny) / denom;
        out.push([c[0]+t*dx, c[1]+t*dy]);
      }
    }
  }
  return out;
}

// Scatter seeds with a minimum separation to avoid degenerate slivers.
function placeSeeds(count) {
  const seeds = [], MIN_D2 = 42*42, pad = 25;
  for (let attempt = 0; seeds.length < count && attempt < 60000; attempt++) {
    const x = LX0+pad + Math.random()*(LX1-LX0-pad*2);
    const y = LY0+pad + Math.random()*(LY1-LY0-pad*2);
    if (!seeds.some(s => (s[0]-x)**2+(s[1]-y)**2 < MIN_D2)) seeds.push([x,y]);
  }
  return seeds;
}

// Build Voronoi cells; return parallel {cells, seeds} with degenerate cells removed.
function buildVoronoiCells(seeds) {
  const cells = [], vseeds = [];
  seeds.forEach((s, i) => {
    let cell = [[LX0,LY0],[LX1,LY0],[LX1,LY1],[LX0,LY1]];
    for (let j = 0; j < seeds.length && cell.length >= 3; j++) {
      if (j !== i) cell = clipCell(cell, s, seeds[j]);
    }
    if (cell.length >= 3) { cells.push(cell); vseeds.push(s); }
  });
  return { cells, seeds: vseeds };
}

// Two Voronoi cells share an edge when >= 2 of their vertices coincide.
function cellsAdjacent(a, b) {
  let n = 0;
  for (const va of a) {
    for (const vb of b) {
      if ((va[0]-vb[0])**2+(va[1]-vb[1])**2 < 1.0) { if (++n >= 2) return true; }
    }
  }
  return false;
}

function shuffleArr(arr) {
  for (let i = arr.length-1; i > 0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
}

// Split cells into sea/land, assign GDD-compliant types, return both arrays.
function generateMap(cells, seeds, seaSet) {
  // Full adjacency table (land + sea cells together)
  const adj = cells.map(() => []);
  for (let i = 0; i < cells.length; i++) {
    for (let j = i+1; j < cells.length; j++) {
      if (cellsAdjacent(cells[i], cells[j])) { adj[i].push(j); adj[j].push(i); }
    }
  }

  // Partition into sea regions and land regions
  const seaRegions = [], landCells = [], landSeeds = [], landOrig = [];
  cells.forEach((pts, i) => {
    if (seaSet.has(i)) {
      seaRegions.push({ pts });
    } else {
      landOrig.push(i);
      landCells.push(pts);
      landSeeds.push(seeds[i]);
    }
  });

  const NR = landCells.length, used = new Set();
  const landRegions = landCells.map((pts, li) => ({
    pts, owner: null, type: 'empty', units: 0,
    coastal: adj[landOrig[li]].some(j => seaSet.has(j)),
    floodTurnsRemaining: 0,
    wildfire: false,
  }));

  // 4 player castles — nearest land seed to each corner
  [[LX0,LY0],[LX1,LY0],[LX0,LY1],[LX1,LY1]].forEach(([tx,ty], fi) => {
    let best=-1, bd=Infinity;
    for (let i=0; i<NR; i++) {
      if (used.has(i)) continue;
      const d=(landSeeds[i][0]-tx)**2+(landSeeds[i][1]-ty)**2;
      if (d<bd) { bd=d; best=i; }
    }
    used.add(best);
    Object.assign(landRegions[best], { owner: fi, type: 'castle', units: 3 });
  });

  // 2 neutral castles — nearest to map centre
  const mcx=(LX0+LX1)/2, mcy=(LY0+LY1)/2;
  [...Array(NR).keys()]
    .filter(i => !used.has(i))
    .sort((a,b) =>
      (landSeeds[a][0]-mcx)**2+(landSeeds[a][1]-mcy)**2 -
      ((landSeeds[b][0]-mcx)**2+(landSeeds[b][1]-mcy)**2))
    .slice(0,2)
    .forEach(i => { used.add(i); Object.assign(landRegions[i], { type: 'castle', units: 2 }); });

  // 6-8 villages spread randomly among the remaining regions
  const nVil = 6 + Math.floor(Math.random()*3);
  const pool = [...Array(NR).keys()].filter(i => !used.has(i));
  shuffleArr(pool);
  pool.slice(0, nVil)
    .forEach(i => { used.add(i); Object.assign(landRegions[i], { type: 'village', units: 1 }); });

  // Build land-to-land adjacency (sea cells excluded)
  const origToLand = new Map();
  landOrig.forEach((orig, li) => origToLand.set(orig, li));
  const landAdj = landCells.map((_, li) =>
    adj[landOrig[li]].filter(j => origToLand.has(j)).map(j => origToLand.get(j))
  );

  return { landRegions, seaRegions, landAdj };
}

// ─── Generate map ─────────────────────────────────────────────────────────────
const _nLand = 28 + Math.floor(Math.random()*5);  // 28-32 land regions
const _nSea  = 2  + Math.floor(Math.random()*3);  // 2-4 sea corridors

const _landSeeds = placeSeeds(_nLand);

// Generate elongated sea corridors — each a tight line of seeds whose Voronoi
// cells clip into thin perpendicular slivers, forming a fjord, strait, or river.
function genSeaCorridors(nSea, landSeeds) {
  // STEP: along-corridor seed spacing → controls sliver length.
  // MIN_LAND_D2: sea seeds stay ≥30 px from land → min sea cell half-width = 15 px.
  // MAX_HALF: reject corridors where land is >52 px away on either perpendicular side,
  //   keeping max corridor total width at 52 px and worst-case area under 5% of map.
  const STEP = 22, MIN_LAND_D2 = 30*30, MAX_HALF = 52, MIN_CTR_D2 = 110*110;
  const CORN_PAD = 155;
  const corners = [
    [LX0+CORN_PAD, LY0+CORN_PAD], [LX1-CORN_PAD, LY0+CORN_PAD],
    [LX0+CORN_PAD, LY1-CORN_PAD], [LX1-CORN_PAD, LY1-CORN_PAD],
  ];
  const placed = [], ctrs = [];

  for (let si = 0; si < nSea; si++) {
    const nPts = 3 + Math.floor(Math.random()*3);  // 3-5 seeds per corridor
    let pts = null;

    for (let att = 0; att < 2000 && !pts; att++) {
      const cx = LX0+100 + Math.random()*(LX1-LX0-200);
      const cy = LY0+90  + Math.random()*(LY1-LY0-180);
      if (corners.some(([kx,ky]) => (cx-kx)**2+(cy-ky)**2 < CORN_PAD*CORN_PAD)) continue;
      if (ctrs.some(([ox,oy]) => (cx-ox)**2+(cy-oy)**2 < MIN_CTR_D2)) continue;
      const ang = Math.random()*Math.PI;
      const cos = Math.cos(ang), sin = Math.sin(ang);
      const half = (nPts-1)/2;
      const cands = Array.from({length:nPts}, (_,i) => [
        cx + (i-half)*STEP*cos,
        cy + (i-half)*STEP*sin,
      ]);
      if (!cands.every(([x,y]) => x > LX0+25 && x < LX1-25 && y > LY0+25 && y < LY1-25)) continue;
      const existing = [...landSeeds, ...placed];
      if (cands.some(p => existing.some(s => (s[0]-p[0])**2+(s[1]-p[1])**2 < MIN_LAND_D2))) continue;
      // Accept only if land seeds flank the corridor within MAX_HALF on both sides,
      // so the corridor sits in a tight gap rather than open space.
      const px = -sin, py = cos;
      const reach = half * STEP + STEP;
      let minL = Infinity, minR = Infinity;
      for (const s of landSeeds) {
        const dx = s[0]-cx, dy = s[1]-cy;
        if (Math.abs(dx*cos + dy*sin) > reach) continue;
        const perp = dx*px + dy*py;
        if (perp > 0) minL = Math.min(minL, perp);
        else          minR = Math.min(minR, -perp);
      }
      if (minL > MAX_HALF || minR > MAX_HALF) continue;
      pts = cands;
      ctrs.push([cx, cy]);
    }
    if (pts) placed.push(...pts);
  }
  return placed;
}

const _seaSeeds = genSeaCorridors(_nSea, _landSeeds);
const _allSeeds = [..._landSeeds, ..._seaSeeds];
const { cells: _cells, seeds: _seeds } = buildVoronoiCells(_allSeeds);

const _seaKeySet = new Set(_seaSeeds.map(([x,y]) => `${x},${y}`));
const _seaSet    = new Set(
  _seeds.reduce((acc,[x,y],i) => { if (_seaKeySet.has(`${x},${y}`)) acc.push(i); return acc; }, [])
);

const { landRegions, seaRegions, landAdj } = generateMap(_cells, _seeds, _seaSet);

// ─── Turn / selection state ───────────────────────────────────────────────────
const MOVES_PER_TURN = 3;
const MAX_TURNS      = 12;
const FACTION_NAMES  = ['Merchants', 'Warriors', 'Stoics', 'Ninjas'];
const HUMAN_FACTION  = 0;
let currentTurn    = 1;
let currentFaction = 0;   // 0-3, whose turn it is right now
let aiTurnActive   = false;
let movesLeft      = MOVES_PER_TURN;
const movedRegions = new Set();   // land-region indices that have already moved this turn
let selectedRegion  = null;        // land-region index owned by player 0, or null
let combatBlocked      = false;     // true while any combat animation is playing
let flashState         = null;      // { idx, lit } during battle flash, else null
let splitCount         = 0;         // units committed to next move (set when region is selected)
const coins            = [0, 0, 0, 0]; // coin balance per faction index
const eliminated       = [false, false, false, false];
let gameOver           = false;
const RECRUIT_COSTS    = [2, 4, 7, 11, 16];
let recruitedThisTurn  = 0;         // units recruited by player 0 this turn
let recruitCastleIdx   = null;      // region index of open recruit panel, or null
let incomeFlashTimer   = null;      // setTimeout handle for income summary

function movesForFaction(fi) {
  // Ninjas get +1 move every 3rd round (rounds 3, 6, 9 …)
  return (fi === 3 && currentTurn % 3 === 0) ? 4 : MOVES_PER_TURN;
}

// ─── World Event System ───────────────────────────────────────────────────────
const WORLD_EVENTS = [
  { id: 'flood',       emoji: '🌊', name: 'Flood',        desc: 'The waters rise without warning. One coastal region is swallowed by the sea: impassable for two turns, its villages unproductive.' },
  { id: 'wildfire',    emoji: '🔥', name: 'Wildfire',     desc: 'Fire sweeps through the land. One region is impassable and yields no coin. Any army caught inside loses half its forces.' },
  { id: 'richHarvest', emoji: '🌾', name: 'Rich Harvest', desc: 'The fields overflow with plenty. Armies march with full bellies and fight with greater fury. All attackers gain one extra unit in battle this turn.' },
  { id: 'sunnyDays',   emoji: '☀️', name: 'Sunny Days',   desc: 'A rare moment of peace. The land is calm, the skies are clear. No event troubles the realm this turn.' },
];
let currentEvent = null;   // active WORLD_EVENTS entry, or null
let lastEventId  = null;   // id of previous round's event (prevents repeats)
let richHarvest    = false;  // true when Rich Harvest is the active event
let wildfireOverlay = null;  // text string while the "X units lost" banner is showing

// ─── Scale helpers ────────────────────────────────────────────────────────────
const sx  = x  => x * canvas.width  / LW;
const sy  = y  => y * canvas.height / LH;
const spt = pt => [sx(pt[0]), sy(pt[1])];

function tracePoly(pts) {
  const [fx, fy] = spt(pts[0]);
  ctx.beginPath();
  ctx.moveTo(fx, fy);
  for (let i = 1; i < pts.length; i++) {
    const [x, y] = spt(pts[i]);
    ctx.lineTo(x, y);
  }
  ctx.closePath();
}

// ─── Interaction helpers ──────────────────────────────────────────────────────
// Ray-casting point-in-polygon test in logical coordinates.
function pointInPoly(px, py, pts) {
  let inside = false;
  for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
    const xi = pts[i][0], yi = pts[i][1];
    const xj = pts[j][0], yj = pts[j][1];
    if ((yi > py) !== (yj > py) && px < (xj - xi) * (py - yi) / (yj - yi) + xi)
      inside = !inside;
  }
  return inside;
}

function logicalFromEvent(e) {
  const rect = canvas.getBoundingClientRect();
  return [
    (e.clientX - rect.left) / rect.width  * LW,
    (e.clientY - rect.top)  / rect.height * LH,
  ];
}

function hitLandRegion(lpx, lpy) {
  for (let i = 0; i < landRegions.length; i++) {
    if (pointInPoly(lpx, lpy, landRegions[i].pts)) return i;
  }
  return -1;
}

// Flash the contested region 4 times (~640 ms), then call onDone.
function runCombatFlash(idx, color, onDone) {
  const STEPS = 8, INTERVAL = 80;
  let step = 0;
  function tick() {
    flashState = { idx, color, lit: step % 2 === 0 };
    render();
    step++;
    if (step < STEPS) setTimeout(tick, INTERVAL);
    else { flashState = null; onDone(); }
  }
  tick();
}

// Execute a move from fromIdx into toIdx.  onComplete is called when the move
// (including any combat animation) has fully resolved; omit for human moves.
// commitUnits: how many units to send (defaults to all).  Remaining units stay
// at the source and may act again this turn.
function executeMove(fromIdx, toIdx, onComplete, commitUnits) {
  const from     = landRegions[fromIdx];
  const to       = landRegions[toIdx];
  const attacker = from.owner;
  if (commitUnits === undefined) commitUnits = from.units;

  if (to.owner === attacker) {
    // Moving into own region — merge committed units
    to.units   += commitUnits;
    from.units -= commitUnits;
    movesLeft--;
    selectedRegion = null;
    if (onComplete) onComplete();
    return;
  }

  // Faction passives + Rich Harvest only apply when there are actual defenders to fight
  const isCombat    = to.units > 0;
  const atkStrength = commitUnits
    + (isCombat && attacker === 1 ? 1 : 0)
    + (isCombat && richHarvest    ? 1 : 0);
  const defStrength = to.units
    + (isCombat && to.owner === 2 ? 1 : 0);

  function resolveAttackerWins(survivors) {
    to.owner    = attacker;
    to.units    = survivors;
    from.units -= commitUnits;
    movedRegions.add(toIdx);
    movesLeft--;
    selectedRegion = null;
  }

  function resolveDefenderWins(defSurvivors) {
    from.units -= commitUnits;
    to.units    = defSurvivors;
    movesLeft--;
    selectedRegion = null;
  }

  // Block input for all combat, flash first, then resolve
  combatBlocked = true;
  selectedRegion = null;
  runCombatFlash(toIdx, FACTION_COLORS[attacker], () => {
    if (atkStrength > defStrength) {
      const survivors = commitUnits - to.units;
      resolveAttackerWins(survivors);
      render();
      drawVictoryOverlay(survivors);
      setTimeout(() => {
        combatBlocked = false;
        checkEliminations(shouldEnd => {
          if (shouldEnd) { showGameOver(); return; }
          render();
          updateSidebar();
          if (onComplete) onComplete();
        });
      }, 1000);
    } else if (defStrength > atkStrength) {
      const survivors = to.units - commitUnits;
      resolveDefenderWins(survivors);
      render();
      drawDefeatOverlay(survivors);
      setTimeout(() => {
        combatBlocked = false;
        checkEliminations(shouldEnd => {
          if (shouldEnd) { showGameOver(); return; }
          render();
          updateSidebar();
          if (onComplete) onComplete();
        });
      }, 1000);
    } else {
      // Tie — flash already played, now show message then 50/50
      render();
      drawTieOverlay();
      setTimeout(() => {
        if (Math.random() < 0.5) resolveAttackerWins(1);
        else                      resolveDefenderWins(1);
        combatBlocked = false;
        checkEliminations(shouldEnd => {
          if (shouldEnd) { showGameOver(); return; }
          render();
          updateSidebar();
          if (onComplete) onComplete();
        });
      }, 1500);
    }
  });
}

function drawCombatOverlay(text, color) {
  const cx = canvas.width  / 2;
  const cy = canvas.height / 2;
  const w  = 420, h = 64;
  ctx.fillStyle = 'rgba(20, 12, 4, 0.72)';
  ctx.beginPath();
  ctx.roundRect(cx - w / 2, cy - h / 2, w, h, 10);
  ctx.fill();
  ctx.fillStyle    = color;
  ctx.font         = 'bold 20px Georgia';
  ctx.textAlign    = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, cx, cy);
}

function drawVictoryOverlay(survivors) {
  const u = survivors === 1 ? 'unit' : 'units';
  drawCombatOverlay(`Victory!  ${survivors} ${u} remaining`, '#8fbe70');
}

function drawDefeatOverlay(survivors) {
  const u = survivors === 1 ? 'unit' : 'units';
  drawCombatOverlay(`Defeated!  Defender has ${survivors} ${u} remaining`, '#c97b84');
}

function drawTieOverlay() {
  drawCombatOverlay('Evenly matched!  Fate decides…', '#f5e6c8');
}

// Returns true if the human player can select/activate this land-region index.
function canSelect(idx) {
  const r = landRegions[idx];
  return r.owner === 0
      && r.units > 0
      && !movedRegions.has(idx)
      && movesLeft > 0
      && !(r.floodTurnsRemaining > 0)
      && !r.wildfire;
}

// Flooded and burning regions are impassable — nothing can move in or out.
function isValidMoveTarget(toIdx) {
  const r = landRegions[toIdx];
  return !(r.floodTurnsRemaining > 0) && !r.wildfire;
}

// ─── Elimination & game over ──────────────────────────────────────────────────

// Neutralize all regions of newly eliminated factions, show an elimination card
// for each, then call onDone(shouldEnd) — where shouldEnd is true when the game
// should end (human eliminated or ≤1 faction alive).  onDone is called
// synchronously when there are no new eliminations, asynchronously (after 2 s)
// when a card is shown.
function checkEliminations(onDone) {
  const newlyElim = [];
  for (let fi = 0; fi < 4; fi++) {
    if (eliminated[fi]) continue;
    const hasArmy   = landRegions.some(r => r.owner === fi && r.units > 0);
    const hasCastle = landRegions.some(r => r.owner === fi && r.type === 'castle');
    if (!hasArmy && !hasCastle) {
      eliminated[fi] = true;
      for (const r of landRegions) {
        if (r.owner === fi) { r.owner = null; r.units = 0; }
      }
      newlyElim.push(fi);
    }
  }
  if (newlyElim.length) { render(); updateSidebar(); }
  const active    = [0, 1, 2, 3].filter(f => !eliminated[f]);
  const shouldEnd = active.length <= 1 || eliminated[HUMAN_FACTION];
  if (newlyElim.length > 0) {
    showEliminationCard(newlyElim[0], () => { if (onDone) onDone(shouldEnd); });
  } else {
    if (onDone) onDone(shouldEnd);
  }
}

function determineWinner() {
  const counts = [0, 0, 0, 0], castleCounts = [0, 0, 0, 0];
  for (const r of landRegions) {
    if (r.owner !== null) {
      counts[r.owner]++;
      if (r.type === 'castle') castleCounts[r.owner]++;
    }
  }
  const active = [0, 1, 2, 3].filter(f => !eliminated[f]);
  if (active.length === 0) return -1;
  let best = active[0];
  for (const fi of active) {
    if (counts[fi] > counts[best]) { best = fi; continue; }
    if (counts[fi] === counts[best] && castleCounts[fi] > castleCounts[best]) { best = fi; continue; }
    if (counts[fi] === counts[best] && castleCounts[fi] === castleCounts[best] && coins[fi] > coins[best]) best = fi;
  }
  return best;
}

function showGameOver() {
  gameOver = true;
  aiTurnActive = true; // freeze all input
  try { localStorage.removeItem(SAVE_KEY); } catch (_) {}

  const counts = [0, 0, 0, 0], castleCounts = [0, 0, 0, 0];
  for (const r of landRegions) {
    if (r.owner !== null) { counts[r.owner]++; if (r.type === 'castle') castleCounts[r.owner]++; }
  }

  const winner   = determineWinner();
  const humanWon = winner === HUMAN_FACTION;

  const titleEl = document.getElementById('gameover-title');
  titleEl.textContent = humanWon ? 'Victory!' : 'Defeat';
  titleEl.style.color = humanWon ? '#8fbe70' : '#c97b84';

  document.getElementById('gameover-winner').textContent = humanWon
    ? 'You have conquered the realm!'
    : (winner === -1 ? 'The realm lies in ruin.' : `${FACTION_NAMES[winner]} have claimed the realm.`);

  document.getElementById('gameover-scores').innerHTML = [0, 1, 2, 3].map(fi => {
    const isW = fi === winner, isE = eliminated[fi];
    return `<div class="score-row${isW ? ' winner' : ''}">` +
      `<div class="score-dot" style="background:${FACTION_COLORS[fi]}"></div>` +
      `<div class="score-name">${FACTION_NAMES[fi]}${isE ? ' <em style="color:#4a3020;font-size:11px">(eliminated)</em>' : ''}</div>` +
      `<div class="score-stats">${counts[fi]} rgn · ${castleCounts[fi]} castle · ${coins[fi]}c</div>` +
      `</div>`;
  }).join('');

  document.getElementById('gameover-screen').style.display = 'flex';
}

// ─── Recruitment panel ───────────────────────────────────────────────────────
function recruitCost() {
  return RECRUIT_COSTS[Math.min(recruitedThisTurn, RECRUIT_COSTS.length - 1)];
}

function openRecruitPanel(idx) {
  recruitCastleIdx = idx;
  refreshRecruitPanel();
}

function closeRecruitPanel() {
  recruitCastleIdx = null;
  document.getElementById('recruit-panel').style.display = 'none';
}

function refreshRecruitPanel() {
  if (recruitCastleIdx === null) return;
  const cost = recruitCost();
  document.getElementById('recruit-panel').style.display = 'block';
  document.getElementById('recruit-info').innerHTML =
    `Balance: <strong>${coins[0]}c</strong><br>Next unit costs: <strong>${cost}c</strong>`;
  const btn = document.getElementById('recruit-btn');
  btn.textContent = `Recruit (${cost}c)`;
  btn.disabled = coins[0] < cost;
}

function endFactionTurn() {
  const fi = currentFaction;

  // Income + army production (only if still in the game)
  if (!eliminated[fi]) {
    const owned    = landRegions.filter(r => r.owner === fi);
    const castles  = owned.filter(r => r.type === 'castle');
    const villages = owned.filter(r => r.type === 'village');
    const activeVillages = villages.filter(r => !(r.floodTurnsRemaining > 0) && !r.wildfire);
    const coinGain = castles.length + activeVillages.length * 2 + (fi === HUMAN_FACTION ? 1 : 0);
    coins[fi] += coinGain;
    for (const c of castles) c.units++;
    const bonus = Math.floor(villages.length / 2);
    let bonusApplied = 0;
    for (let i = 0; i < bonus && i < castles.length; i++) { castles[i].units++; bonusApplied++; }

    if (fi === HUMAN_FACTION) {
      const flash = document.getElementById('income-flash');
      flash.textContent = `+${coinGain} coins  ·  +${castles.length + bonusApplied} units`;
      flash.style.display = 'block';
      clearTimeout(incomeFlashTimer);
      incomeFlashTimer = setTimeout(() => { flash.style.display = 'none'; }, 2000);
    }
  }

  // Reset per-faction-turn state
  movedRegions.clear();
  selectedRegion = null;
  recruitedThisTurn = 0;
  closeRecruitPanel();

  // Check for eliminations caused by income/production (e.g. castle stolen last turn)
  checkEliminations(shouldEnd => {
    if (shouldEnd) { showGameOver(); return; }

    // Find next non-eliminated faction; track if we cross the round boundary (3 → 0)
    let nextFaction = fi;
    let roundEnded = false;
    for (let i = 0; i < 4; i++) {
      nextFaction = (nextFaction + 1) % 4;
      if (nextFaction === 0) roundEnded = true;
      if (!eliminated[nextFaction]) break;
    }

    if (roundEnded) {
      for (const r of landRegions) {
        if (r.floodTurnsRemaining > 0) r.floodTurnsRemaining--;
        r.wildfire = false;
      }
      currentTurn++;
      if (currentTurn > MAX_TURNS) { showGameOver(); return; }
      drawWorldEvent();
    }

    currentFaction = nextFaction;
    movesLeft = movesForFaction(currentFaction);

    updateSidebar();
    render();
    saveGame();

    if (currentFaction !== HUMAN_FACTION) runAiTurn();
  });
}

// ─── AI ──────────────────────────────────────────────────────────────────────

// Spend coins at the start of an AI turn: always buy 1st unit (2c), buy 2nd if
// starting coins were > 8 (cost 4), never buy 3rd+.
function aiRecruit(fi) {
  const castleIdxs = landRegions.reduce((a, r, i) => {
    if (r.owner === fi && r.type === 'castle') a.push(i);
    return a;
  }, []);
  if (!castleIdxs.length) return;

  const startCoins = coins[fi];
  if (startCoins >= RECRUIT_COSTS[0]) {
    const idx = castleIdxs[Math.floor(Math.random() * castleIdxs.length)];
    coins[fi] -= RECRUIT_COSTS[0];
    landRegions[idx].units++;
  }
  if (startCoins > 8 && coins[fi] >= RECRUIT_COSTS[1]) {
    const idx = castleIdxs[Math.floor(Math.random() * castleIdxs.length)];
    coins[fi] -= RECRUIT_COSTS[1];
    landRegions[idx].units++;
  }
}

// Score a potential move from fromIdx to toIdx for faction fi.
// Returns -1 if illegal/inadvisable, otherwise a positive priority score.
function scoreAiMove(fromIdx, toIdx, fi) {
  const from = landRegions[fromIdx];
  const to   = landRegions[toIdx];
  if (to.floodTurnsRemaining > 0 || to.wildfire) return -1;
  if (to.owner === fi) return -1; // merging own units is not in the priority list

  const atkStrength = from.units + (fi === 1 ? 1 : 0) + (richHarvest ? 1 : 0);
  const defStrength = to.units   + (to.owner === 2 ? 1 : 0);

  if (to.owner === null) {
    if (atkStrength <= defStrength) return -1; // can't win
    if (to.type === 'castle')  return 4;
    if (to.type === 'village') return 3;
    return 1; // empty neutral
  }

  // Enemy region — only attack if we can win outright (no suicidal ties)
  if (atkStrength <= defStrength) return -1;
  if (to.type === 'castle')  return 5;
  if (to.type === 'village') return 2;
  return 1; // empty enemy region
}

// Find the single best move for faction fi across all its regions.
function aiPickBestMove(fi) {
  let best = null, bestScore = 0;
  for (let fromIdx = 0; fromIdx < landRegions.length; fromIdx++) {
    const from = landRegions[fromIdx];
    if (from.owner !== fi || movedRegions.has(fromIdx) || from.units <= 0) continue;
    if (from.floodTurnsRemaining > 0 || from.wildfire) continue;
    for (const toIdx of landAdj[fromIdx]) {
      const score = scoreAiMove(fromIdx, toIdx, fi);
      if (score > bestScore) { bestScore = score; best = { fromIdx, toIdx }; }
    }
  }
  return best;
}

// Execute one AI move; once the animation resolves, wait 600ms then pick next.
function aiDoNextMove(fi) {
  if (movesLeft <= 0) { aiTurnActive = false; endFactionTurn(); return; }
  const move = aiPickBestMove(fi);
  if (!move)          { aiTurnActive = false; endFactionTurn(); return; }

  // Keep the source region highlighted throughout the combat flash so the
  // player can see where the attack came from. executeMove clears
  // selectedRegion synchronously; we restore it right after so the first
  // flash tick (queued via setTimeout) still sees it.
  executeMove(move.fromIdx, move.toIdx, () => {
    setTimeout(() => aiDoNextMove(fi), 600);
  });
  selectedRegion = move.fromIdx; // restore after executeMove clears it
}

function runAiTurn() {
  const fi = currentFaction;
  aiTurnActive = true;
  aiRecruit(fi);
  render();
  updateSidebar();
  // Brief pause before first move so the player registers whose turn it is
  setTimeout(() => aiDoNextMove(fi), 600);
}

// ─── Save / load ─────────────────────────────────────────────────────────────
const SAVE_KEY = 'woc_save';

function saveGame() {
  const state = {
    currentTurn,
    currentFaction,
    movesLeft,
    recruitedThisTurn,
    coins: coins.slice(),
    movedRegions: [...movedRegions],
    currentEvent,
    lastEventId,
    richHarvest,
    eliminated: eliminated.slice(),
    landRegions: landRegions.map(r => ({
      pts: r.pts, owner: r.owner, type: r.type, units: r.units, coastal: r.coastal,
      floodTurnsRemaining: r.floodTurnsRemaining ?? 0,
      wildfire: r.wildfire ?? false,
    })),
    seaRegions:  seaRegions.map(r => ({ pts: r.pts })),
    landAdj:     landAdj.map(a => a.slice()),
  };
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch (_) {}
}

function loadGame(state) {
  landRegions.length = 0;
  for (const r of state.landRegions) landRegions.push(r);

  seaRegions.length = 0;
  for (const r of state.seaRegions) seaRegions.push(r);

  landAdj.length = 0;
  for (const a of state.landAdj) landAdj.push(a);

  currentTurn       = state.currentTurn;
  currentFaction    = state.currentFaction ?? HUMAN_FACTION;
  movesLeft         = state.movesLeft;
  recruitedThisTurn = state.recruitedThisTurn ?? 0;
  state.coins.forEach((v, i) => { coins[i] = v; });
  movedRegions.clear();
  for (const i of state.movedRegions) movedRegions.add(i);
  currentEvent = state.currentEvent ?? null;
  lastEventId  = state.lastEventId  ?? null;
  richHarvest  = state.richHarvest  ?? false;
  if (state.eliminated) state.eliminated.forEach((v, i) => { eliminated[i] = v; });
  selectedRegion = null;
  gameOver = false;
  closeRecruitPanel();
}

// ─── Icon helpers ─────────────────────────────────────────────────────────────
// All icons receive canvas-pixel coordinates (already scaled).
const ICON_INK = 'rgba(35,22,8,0.72)';

// Centroid of a polygon in logical coordinates → canvas pixels.
function centroid(pts) {
  const lx = pts.reduce((s, p) => s + p[0], 0) / pts.length;
  const ly = pts.reduce((s, p) => s + p[1], 0) / pts.length;
  return spt([lx, ly]);
}

function drawCastle(cx, cy) {
  const size = 42;
  if (castleImgReady) {
    ctx.save();
    ctx.globalCompositeOperation = 'multiply';
    ctx.drawImage(_castleImg, cx - size / 2, cy - size / 2, size, size);
    ctx.restore();
  } else {
    const w = 18, bodyH = 13, mw = 5, mh = 5;
    const x = cx - w / 2, y = cy - (bodyH + mh) / 2;
    ctx.fillStyle = ICON_INK;
    ctx.fillRect(x,               y + mh, w,  bodyH);
    ctx.fillRect(x,               y,      mw, mh);
    ctx.fillRect(x + (w - mw)/2,  y,      mw, mh);
    ctx.fillRect(x + w - mw,      y,      mw, mh);
  }
}

// Triangle roof on a small rectangle.
function drawVillage(cx, cy) {
  const w = 16, bodyH = 10, roofH = 8;
  const x = cx - w / 2, y = cy - (bodyH + roofH) / 2;
  ctx.fillStyle = ICON_INK;
  ctx.fillRect(x, y + roofH, w, bodyH);   // walls
  ctx.beginPath();
  ctx.moveTo(cx,      y);           // peak
  ctx.lineTo(x + w,  y + roofH);   // right eave
  ctx.lineTo(x,      y + roofH);   // left eave
  ctx.closePath();
  ctx.fill();                        // roof
}


// Up to 5 stacked circles; 6+ shows a number.
function drawUnits(cx, cy, units) {
  if (units <= 0) return;
  const baseY = cy + 26;
  ctx.fillStyle = ICON_INK;
  if (units <= 5) {
    const span = (units - 1) * 10;
    for (let i = 0; i < units; i++) {
      ctx.beginPath();
      ctx.arc(cx - span / 2 + i * 10, baseY, 4, 0, Math.PI * 2);
      ctx.fill();
    }
  } else {
    ctx.font = 'bold 12px Georgia';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(String(units), cx, baseY);
  }
}

// ─── Draw routines ────────────────────────────────────────────────────────────
function drawSea(region) {
  ctx.save();
  tracePoly(region.pts);
  ctx.clip();
  if (waterPattern) {
    ctx.drawImage(_waterImg, 0, 0, canvas.width, canvas.height);
  } else {
    ctx.fillStyle = '#7bbdd4';
    ctx.fill();
  }
  ctx.restore();

  // Seal hairline gaps at cell boundaries
  tracePoly(region.pts);
  ctx.strokeStyle = '#7bbdd4';
  ctx.lineWidth = 3;
  ctx.lineJoin = 'round';
  ctx.stroke();
}

function drawLand(region) {
  ctx.save();
  tracePoly(region.pts);
  ctx.clip();
  if (regionsReady) {
    ctx.drawImage(_regionsImg, 0, 0, canvas.width, canvas.height);
  } else {
    ctx.fillStyle = NEUTRAL_COLOR;
    ctx.fill();
  }
  ctx.restore();

  // Faction / neutral colour at 70% opacity over the texture
  const baseColor = region.owner === null ? NEUTRAL_COLOR : FACTION_COLORS[region.owner];
  tracePoly(region.pts);
  ctx.fillStyle = hexToRgba(baseColor, 0.5);
  ctx.fill();

  // Coastal land gets a faint blue tint near the sea
  if (region.coastal) {
    tracePoly(region.pts);
    ctx.fillStyle = 'rgba(80, 140, 170, 0.09)';
    ctx.fill();
  }

  // Dark hand-drawn-style border
  tracePoly(region.pts);
  ctx.strokeStyle = '#352210';
  ctx.lineWidth = 2;
  ctx.lineJoin = 'round';
  ctx.stroke();

  // Icons drawn on top of the filled + bordered region
  const [cx, cy] = centroid(region.pts);
  if (region.type === 'castle')  drawCastle(cx, cy);
  if (region.type === 'village') drawVillage(cx, cy);

  drawUnits(cx, cy, region.units);
}

// ─── Main render ──────────────────────────────────────────────────────────────
function render() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Deep parchment background (shows through any hairline gaps)
  ctx.fillStyle = '#2a1e0a';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  for (const r of landRegions) drawLand(r);
  for (const r of seaRegions)  drawSea(r);

  // Uniform land borders drawn last so they're crisp and consistent
  ctx.lineJoin = 'round';
  for (const r of landRegions) {
    tracePoly(r.pts);
    ctx.strokeStyle = '#352210';
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  // ── Dim regions that have already moved this turn ────────────────────────
  ctx.lineJoin = 'round';
  for (const mi of movedRegions) {
    tracePoly(landRegions[mi].pts);
    ctx.fillStyle = 'rgba(0, 0, 0, 0.30)';
    ctx.fill();
  }

  // ── Flood overlay ─────────────────────────────────────────────────────────
  for (let i = 0; i < landRegions.length; i++) {
    const r = landRegions[i];
    if (!(r.floodTurnsRemaining > 0)) continue;
    tracePoly(r.pts);
    ctx.fillStyle = 'rgba(40, 110, 200, 0.42)';
    ctx.fill();
    const [fcx, fcy] = centroid(r.pts);
    ctx.font = '20px serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('🌊', fcx, fcy);
  }

  // ── Wildfire overlay ──────────────────────────────────────────────────────
  for (let i = 0; i < landRegions.length; i++) {
    const r = landRegions[i];
    if (!r.wildfire) continue;
    tracePoly(r.pts);
    ctx.fillStyle = 'rgba(210, 90, 10, 0.42)';
    ctx.fill();
    const [wcx, wcy] = centroid(r.pts);
    ctx.font = '20px serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('🔥', wcx, wcy);
  }

  // ── Wildfire unit-loss banner ─────────────────────────────────────────────
  if (wildfireOverlay !== null) {
    drawCombatOverlay(wildfireOverlay, '#e8882a');
  }

  // ── Selection highlights ──────────────────────────────────────────────────
  if (selectedRegion !== null) {
    ctx.lineJoin = 'round';

    // Valid move targets — warm parchment tint overlay
    for (const ni of landAdj[selectedRegion]) {
      if (!isValidMoveTarget(ni)) continue;
      tracePoly(landRegions[ni].pts);
      ctx.fillStyle = 'rgba(232, 216, 154, 0.50)';
      ctx.fill();
    }

    // Selected region — warm off-white border
    tracePoly(landRegions[selectedRegion].pts);
    ctx.strokeStyle = '#f5e6c8';
    ctx.lineWidth = 3;
    ctx.stroke();
  }

  // ── Battle flash ─────────────────────────────────────────────────────────
  if (flashState !== null && flashState.lit) {
    tracePoly(landRegions[flashState.idx].pts);
    ctx.globalAlpha = 0.60;
    ctx.fillStyle = flashState.color;
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

// ─── Resize handler ───────────────────────────────────────────────────────────
function resize() {
  const wrap = document.getElementById('map-wrap');
  canvas.width  = wrap.clientWidth;
  canvas.height = wrap.clientHeight;
  render();
  positionStepper();
}

window.addEventListener('resize', resize);
resize();

// ─── World event helpers ──────────────────────────────────────────────────────
function updateEventSidebar() {
  const box = document.querySelector('.event-box');
  if (!currentEvent) {
    box.innerHTML = '<span class="event-empty">No event this turn</span>';
    return;
  }
  box.innerHTML =
    `<div class="event-box-header">` +
      `<span style="font-size:21px">${currentEvent.emoji}</span>` +
      `<span style="color:#c0a870;font-size:13px">${currentEvent.name}</span>` +
    `</div>` +
    `<div class="event-box-desc">${currentEvent.desc}</div>`;
}

function showEventCard(event) {
  const card = document.getElementById('event-card');
  card.querySelector('.event-card-emoji').textContent = event.emoji;
  card.querySelector('.event-card-label').textContent = 'World Event';
  card.querySelector('.event-card-name').textContent  = event.name;
  card.style.display = 'flex';
  setTimeout(() => { card.style.display = 'none'; }, 2000);
}

function showEliminationCard(fi, onDone) {
  const card = document.getElementById('event-card');
  card.querySelector('.event-card-emoji').textContent = '💀';
  card.querySelector('.event-card-label').textContent = 'Eliminated';
  card.querySelector('.event-card-name').textContent  = `${FACTION_NAMES[fi]} have fallen`;
  card.style.display = 'flex';
  setTimeout(() => { card.style.display = 'none'; if (onDone) onDone(); }, 2000);
}

// Show or hide/reposition the army-split stepper near the selected region.
function positionStepper() {
  const el = document.getElementById('split-stepper');
  if (selectedRegion === null || landRegions[selectedRegion].units <= 1
      || combatBlocked || gameOver || currentFaction !== HUMAN_FACTION) {
    el.style.display = 'none';
    return;
  }
  const [cx, cy] = centroid(landRegions[selectedRegion].pts);
  el.style.left = `${cx}px`;
  el.style.top  = `${cy - 10}px`;
  el.style.display = 'flex';
  document.getElementById('split-count').textContent = splitCount;
}

function applyFloodEvent() {
  const coastalIdxs = landRegions.reduce((acc, r, i) => { if (r.coastal) acc.push(i); return acc; }, []);
  if (coastalIdxs.length === 0) return;
  const idx = coastalIdxs[Math.floor(Math.random() * coastalIdxs.length)];
  landRegions[idx].floodTurnsRemaining = 2;
}

// Returns the number of units killed (0 when a neutral region is targeted).
function applyWildfireEvent() {
  const neutral  = landRegions.reduce((a, r, i) => { if (r.owner === null && !r.wildfire) a.push(i); return a; }, []);
  const occupied = landRegions.reduce((a, r, i) => { if (r.owner !== null && !r.wildfire) a.push(i); return a; }, []);

  if (neutral.length > 0) {
    const idx = neutral[Math.floor(Math.random() * neutral.length)];
    landRegions[idx].wildfire = true;
    landRegions[idx].units = 0;
    return 0;
  }

  if (occupied.length === 0) return 0;   // nowhere to burn (shouldn't happen)

  const idx = occupied[Math.floor(Math.random() * occupied.length)];
  const r   = landRegions[idx];
  r.wildfire  = true;
  const lost  = Math.floor(r.units / 2);
  r.units     = Math.max(r.units - lost, 1);
  return lost;
}

function drawWorldEvent() {
  const pool  = WORLD_EVENTS.filter(e => e.id !== lastEventId);
  const event = pool[Math.floor(Math.random() * pool.length)];
  lastEventId  = event.id;
  currentEvent = event;
  richHarvest  = event.id === 'richHarvest';
  if (event.id === 'flood') applyFloodEvent();

  let wildfireLost = 0;
  if (event.id === 'wildfire') wildfireLost = applyWildfireEvent();

  updateEventSidebar();
  showEventCard(event);

  if (wildfireLost > 0) {
    const u = wildfireLost === 1 ? 'unit' : 'units';
    setTimeout(() => {
      wildfireOverlay = `Wildfire!  ${wildfireLost} ${u} lost to the flames`;
      render();
      setTimeout(() => { wildfireOverlay = null; render(); }, 2000);
    }, 2200);
  }
}

// ─── Sidebar ──────────────────────────────────────────────────────────────────
function updateSidebar() {
  const counts = [0, 0, 0, 0];
  for (const r of landRegions) {
    if (r.owner !== null) counts[r.owner]++;
  }
  document.querySelectorAll('.faction-row[data-faction]').forEach(row => {
    const fi = Number(row.dataset.faction);
    if (eliminated[fi]) {
      row.style.opacity = '0.3';
      row.querySelector('.f-name').style.color = '#4a3020';
      row.querySelector('.f-meta').textContent = 'Eliminated';
    } else {
      row.querySelector('.f-meta').textContent = `${counts[fi]} rgn · ${coins[fi]}c`;
      row.style.opacity = fi === currentFaction ? '1' : '0.5';
      row.querySelector('.f-name').style.color = fi === currentFaction ? '#e8d090' : '#c0a870';
    }
  });

  // Dynamic pips (Ninjas can have 4 on bonus rounds)
  const pipsEl = document.querySelector('.pips');
  const totalMoves = movesForFaction(currentFaction);
  pipsEl.innerHTML = '';
  for (let i = 0; i < totalMoves; i++) {
    const pip = document.createElement('div');
    pip.className = 'pip' + (i >= movesLeft ? ' used' : '');
    pipsEl.appendChild(pip);
  }

  document.getElementById('turn-num').textContent = currentTurn;

  // Whose turn label
  const label = document.getElementById('active-turn-label');
  if (currentFaction === HUMAN_FACTION) {
    label.textContent = 'Your Turn';
    label.style.color = '#c9a84c';
  } else {
    label.textContent = `${FACTION_NAMES[currentFaction]}'s Turn`;
    label.style.color = '#7a6040';
  }

  // End Turn button — disabled during AI turns
  const btn = document.getElementById('end-turn-btn');
  btn.disabled = aiTurnActive || currentFaction !== HUMAN_FACTION;
}

updateSidebar();

// ─── Resume prompt ────────────────────────────────────────────────────────────
(function checkSave() {
  let raw;
  try { raw = localStorage.getItem(SAVE_KEY); } catch (_) {}
  if (!raw) { drawWorldEvent(); render(); return; }

  const prompt = document.getElementById('resume-prompt');
  prompt.style.display = 'flex';

  document.getElementById('resume-yes').addEventListener('click', () => {
    try {
      loadGame(JSON.parse(raw));
    } catch (_) {
      localStorage.removeItem(SAVE_KEY);
    }
    prompt.style.display = 'none';
    updateSidebar();
    updateEventSidebar();
    render();
    if (currentFaction !== HUMAN_FACTION) runAiTurn();
  });

  document.getElementById('resume-no').addEventListener('click', () => {
    localStorage.removeItem(SAVE_KEY);
    prompt.style.display = 'none';
    drawWorldEvent();
    render();
  });
}());

// ─── Canvas interaction ───────────────────────────────────────────────────────
canvas.addEventListener('click', e => {
  if (combatBlocked || aiTurnActive || currentFaction !== HUMAN_FACTION || gameOver) return;
  const [lpx, lpy] = logicalFromEvent(e);
  const hit = hitLandRegion(lpx, lpy);

  if (selectedRegion !== null && hit !== -1 && landAdj[selectedRegion].includes(hit) && isValidMoveTarget(hit)) {
    // Moving into adjacent region — close panel, execute move with committed split
    closeRecruitPanel();
    executeMove(selectedRegion, hit, undefined, splitCount);
  } else {
    const isOwnCastle = hit !== -1 && landRegions[hit].owner === 0 && landRegions[hit].type === 'castle';
    if (isOwnCastle) {
      // Own castle — open recruit panel and select for movement
      openRecruitPanel(hit);
      selectedRegion = hit;
      splitCount = landRegions[hit].units;
    } else if (hit !== -1 && canSelect(hit)) {
      // Own non-castle region — close panel, select for movement
      closeRecruitPanel();
      selectedRegion = hit;
      splitCount = landRegions[hit].units;
    } else {
      // Anything else — close panel, deselect
      closeRecruitPanel();
      selectedRegion = null;
    }
  }

  render();
  updateSidebar();
  positionStepper();
});

document.getElementById('end-turn-btn').addEventListener('click', () => {
  if (!combatBlocked && !aiTurnActive && currentFaction === HUMAN_FACTION) endFactionTurn();
});

document.getElementById('recruit-btn').addEventListener('click', () => {
  if (recruitCastleIdx === null || combatBlocked) return;
  const cost = recruitCost();
  if (coins[0] < cost) return;
  coins[0] -= cost;
  landRegions[recruitCastleIdx].units++;
  recruitedThisTurn++;
  refreshRecruitPanel();
  updateSidebar();
  render();
});

document.getElementById('split-minus').addEventListener('click', () => {
  if (selectedRegion === null) return;
  splitCount = Math.max(1, splitCount - 1);
  document.getElementById('split-count').textContent = splitCount;
});

document.getElementById('split-plus').addEventListener('click', () => {
  if (selectedRegion === null) return;
  splitCount = Math.min(landRegions[selectedRegion].units, splitCount + 1);
  document.getElementById('split-count').textContent = splitCount;
});

canvas.addEventListener('mousemove', e => {
  if (aiTurnActive || currentFaction !== HUMAN_FACTION || gameOver) { canvas.style.cursor = 'default'; return; }
  const [lpx, lpy] = logicalFromEvent(e);
  const hit = hitLandRegion(lpx, lpy);
  const isSelectable  = hit !== -1 && canSelect(hit);
  const isValidTarget = hit !== -1 && selectedRegion !== null && landAdj[selectedRegion].includes(hit) && isValidMoveTarget(hit);
  canvas.style.cursor = (isSelectable || isValidTarget) ? 'pointer' : 'default';
});

document.getElementById('gameover-play-again').addEventListener('click', () => {
  try { localStorage.removeItem(SAVE_KEY); } catch (_) {}
  location.reload();
});

document.getElementById('gameover-new-game').addEventListener('click', () => {
  // Iteration 7 will add a setup screen; for now reload like Play Again
  try { localStorage.removeItem(SAVE_KEY); } catch (_) {}
  location.reload();
});
</script>
